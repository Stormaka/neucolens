services:
  # NEU-CodeLens Backend — Storm v4
  - type: web
    name: neu-codelens-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /var/data/skillslab.db
      - key: FRONTEND_URL
        sync: false        # Ví dụ https://your-app.vercel.app
      - key: GEMINI_API_KEY
        sync: false        # Điền thủ công trên Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false        # Điền thủ công trên Render dashboard
      - key: SEED_DEMO_DATA
        value: false
      - key: ENABLE_LOCAL_RUNNER
        value: false
      - key: LLM_JUDGE_ENABLED
        value: true
    disk:
      name: skillslab-db
      mountPath: /var/data
      sizeGB: 1
